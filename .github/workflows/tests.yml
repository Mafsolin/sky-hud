name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run parser checks
        run: python sky_hud.py --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
