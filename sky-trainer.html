<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Notes</title><style>
:root{--glass:rgba(7,31,45,.7);--line:rgba(190,245,255,.25);--white:#f4ffff;--muted:#b6d5dd;--gold:#ffd9b8;--cyan:#9cefff;--pink:#ffbedb}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:var(--white);background:linear-gradient(145deg,#0a2635,#17758a 48%,#164b42)}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 18%,rgba(220,255,255,.22),transparent 42%),linear-gradient(180deg,transparent 60%,rgba(3,20,27,.65));pointer-events:none}.app{position:relative;height:100%;padding:28px 42px}.top{display:flex;justify-content:flex-end;gap:16px}.round{width:48px;height:48px;border:0;border-radius:50%;background:rgba(2,26,37,.72);color:#ffe6d4;font-size:22px;box-shadow:0 0 0 1px rgba(255,255,255,.1) inset;cursor:pointer}.playfield{position:absolute;inset:14% 5% 16%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:5% 8%;align-items:center;justify-items:center}.note{width:clamp(68px,6vw,112px);aspect-ratio:1;border-radius:17%;display:grid;place-items:center;background:rgba(6,34,46,.7);border:1px solid rgba(185,247,255,.35);color:#fff;font:26px "Segoe UI",sans-serif;transition:.15s;position:relative}.note:after{content:"";position:absolute;inset:9%;border:2px solid var(--gold);border-radius:50%;opacity:.9}.note:nth-child(3n):after{border-radius:0;transform:rotate(45deg)}.note:nth-child(4n):after{border-radius:50%;transform:scale(.75)}.note.active{background:rgba(255,190,161,.28);box-shadow:0 0 0 2px var(--gold),0 0 32px 8px rgba(255,213,186,.55);transform:scale(1.08)}.note.next1{background:rgba(110,215,230,.28);box-shadow:0 0 0 1px rgba(156,239,255,.7)}.note.next2{background:rgba(110,215,230,.18)}.note.next3{background:rgba(110,215,230,.1)}.note.hit{background:rgba(120,255,192,.5);box-shadow:0 0 28px 8px rgba(120,255,192,.7)}.note.wrong{background:rgba(255,100,120,.5)}.hint{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;padding:10px 18px;border-radius:999px;background:rgba(4,27,39,.5);border:1px solid var(--line);font-size:15px;letter-spacing:.4px}.hint b{color:var(--gold)}.footer{position:absolute;bottom:28px;right:46px;color:#e7ffff;font-size:16px}.footer kbd{padding:2px 6px;border-radius:5px;background:#fff;color:#17333d;font:13px "Segoe UI"}.panel{position:fixed;right:28px;top:88px;width:330px;max-height:calc(100vh - 130px);overflow:auto;padding:18px;border-radius:22px;background:rgba(7,27,39,.94);border:1px solid var(--line);box-shadow:0 20px 60px #00131dcc;display:none}.panel.open{display:block}.panel h2{margin:0 0 15px;font-size:21px;font-weight:400}.field{margin:12px 0}.field label{display:block;color:var(--muted);font:12px "Segoe UI";margin-bottom:5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select,input{font:14px "Segoe UI"}button.action{padding:9px 13px;border:1px solid var(--line);border-radius:10px;color:var(--white);background:rgba(80,155,170,.25);cursor:pointer}button.primary{background:linear-gradient(135deg,#ffe5c6,#e99f7f);color:#27313b;border:0}.song{padding:12px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);cursor:pointer}.song.active{border-color:var(--gold)}.song strong{display:block}.song small{color:var(--muted)}textarea,select{width:100%;padding:8px;border-radius:9px;border:1px solid var(--line);background:#0c2b39;color:white}textarea{min-height:90px}.stats{font:13px "Segoe UI";color:var(--muted);margin-top:12px}.progress{position:absolute;left:5%;right:5%;bottom:7%;height:4px;background:rgba(255,255,255,.2)}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd2b0,#aaf3ff)}@media(max-width:700px){.app{padding:18px}.playfield{inset:18% 3% 18%;gap:5% 3%}.note{width:clamp(48px,14vw,78px);font-size:20px}.footer{right:18px;bottom:15px}.hint{bottom:10%;font-size:12px}.panel{right:12px;left:12px;width:auto}}
</style></head><body><main class="app"><div class="top"><button class="round" id="menu" title="Управление">✦</button><button class="round" id="close" title="Закрыть">×</button></div><section class="playfield" id="grid"></section><div class="hint">Сейчас: <b id="current">—</b><span id="next">следующие ноты появятся здесь</span></div><div class="progress"><i id="fill"></i></div><div class="footer">Ноты <kbd>TAB</kbd> &nbsp; Назад <kbd>ESC</kbd></div></main><aside class="panel" id="panel"><h2>Sky Notes</h2><div class="field"><div class="row"><button class="action" id="open">📂 Открыть</button><button class="action" id="demo">Демо</button><input id="file" type="file" accept=".txt,.json" hidden><button class="action" id="openFolder">📁 Папка</button><input id="folder" type="file" webkitdirectory multiple hidden></div></div><div class="field"><label>Библиотека <span id="count"></span></label><input id="search" placeholder="Поиск по названию…"><div class="row" style="margin-top:6px"><select id="sort"><option value="name">По названию</option><option value="size">По размеру</option></select><select id="filter"><option value="all">Все форматы</option><option value="json">JSON</option><option value="txt">TXT</option></select></div><div id="library"></div></div><div class="field"><label>Режим</label><div class="row"><button class="action" id="listen">◉ Слушать</button><button class="action" id="train">◎ Тренировка</button><button class="action" id="step">⇥ Шаги</button></div></div><div class="field"><label>Темп <span id="tempoLabel">100%</span></label><input id="tempo" type="range" min="50" max="150" value="100" style="width:100%"></div><div class="field"><div class="row"><button class="action primary" id="start">▶ Старт</button><button class="action" id="pause">Ⅱ Пауза</button><button class="action" id="stop">■ Стоп</button></div></div><div class="field"><label><input id="sound" type="checkbox" checked> Звук</label><label><input id="metro" type="checkbox" checked> Метроном</label><label><input id="loop" type="checkbox"> Повтор</label></div><div class="field"><label>Импорт JSON</label><textarea id="paste" placeholder="Вставьте songNotes…"></textarea><button class="action" id="loadPaste">Загрузить</button></div><div class="stats" id="stats">Готово к игре</div></aside><input id="keys" hidden></main><script>
const KEYS=['Y','U','I','O','P','H','J','K','L',';','N','M',',','.','/'];let catalog=[];let song=null,events=[],pos=0,timer=null,mode='listen',paused=false,stats={ok:0,miss:0,bad:0},pending=new Set();const $=id=>document.getElementById(id);function makeGrid(){const g=$('grid');g.innerHTML='';KEYS.forEach((k,i)=>{const n=document.createElement('div');n.className='note';n.dataset.i=i;n.textContent=k;g.append(n)})}makeGrid();function parse(text,name='song'){const d=JSON.parse(text);const s=Array.isArray(d)?d[0]:d;if(!s||!Array.isArray(s.songNotes))throw Error('Нет songNotes');const nums=s.songNotes.map(n=>+String(n.key).match(/(\d+)$/)?.[1]).filter(Number.isFinite),one=Math.max(...nums)>14;const es=new Map;for(const n of s.songNotes){const m=String(n.key).match(/(\d+)$/);if(!m)continue;let i=+m[1]-(one?1:0);if(i<0||i>14)continue;const t=+n.time||0;if(!es.has(t))es.set(t,[]);es.get(t).push(i)}events=[...es].sort((a,b)=>a[0]-b[0]).map(([t,ks])=>({t,ks:[...new Set(ks)]}));return {name:s.name||name,bpm:s.bpm||0,dur:events.at(-1)?.t||0,notes:s.songNotes.length}}function load(text,name){try{song=parse(text,name);pos=0;renderLib();$('stats').textContent=`${song.name} · ${Math.round(song.dur/1000)} сек · ${song.notes} нот`;$('panel').classList.remove('open')}catch(e){$('stats').textContent='Ошибка: '+e.message}}function renderLib(){const l=$('library');l.innerHTML='';const q=($('search')?.value||'').toLowerCase();const f=$('filter')?.value||'all';let a=catalog.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(f==='all'||x.ext===f));if($('sort')?.value==='name')a.sort((x,y)=>x.name.localeCompare(y.name));if($('sort')?.value==='size')a.sort((x,y)=>y.size-x.size);$('count').textContent='('+a.length+')';a.slice(0,80).forEach(s=>{const x=document.createElement('div');x.className='song';x.innerHTML=`<strong>${s.name}</strong><small>${s.ext.toUpperCase()} · ${Math.round(s.size/1024)} KB</small>`;x.onclick=()=>s.file.text().then(t=>load(t,s.name));l.append(x)})}function show(){document.querySelectorAll('.note').forEach(x=>x.classList.remove('active','next1','next2','next3'));const e=events[pos];if(!e)return;$('current').textContent=e.ks.map(i=>KEYS[i]).join(' + ');$('next').textContent=events.slice(pos+1,pos+4).map(e=>e.ks.map(i=>KEYS[i]).join(' + ')).join('  ·  ')||'—';events.slice(pos+1,pos+4).forEach((ev,j)=>ev.ks.forEach(i=>document.querySelector(`.note[data-i="${i}"]`)?.classList.add('next'+(j+1))));e.ks.forEach(i=>document.querySelector(`.note[data-i="${i}"]`)?.classList.add('active'));$('fill').style.width=(events.length?pos/events.length*100:0)+'%'}function stop(){clearInterval(timer);timer=null;paused=false;document.querySelectorAll('.note').forEach(x=>x.classList.remove('active','next1','next2','next3'));$('current').textContent='—'}function start(){if(!song||timer)return;const step=Math.max(90,250/(+$('tempo').value/100));timer=setInterval(()=>{if(paused)return;show();if(mode==='listen')pos++;else if(mode==='step')return;if(pos>=events.length){if($('loop').checked){pos=0}else{stop()}}},step);show()}$('menu').onclick=()=> $('panel').classList.toggle('open');$('close').onclick=()=> $('panel').classList.remove('open');$('open').onclick=()=>$('file').click();$('openFolder').onclick=()=>$('folder').click();$('folder').onchange=e=>{catalog=[...e.target.files].filter(f=>/\.(txt|json)$/i.test(f.name)).map(file=>({file,name:file.name.replace(/\.(txt|json)$/i,''),ext:file.name.split('.').pop().toLowerCase(),size:file.size}));renderLib();$('stats').textContent='Загружено файлов: '+catalog.length};['search','sort','filter'].forEach(id=>$(id)?.addEventListener('input',renderLib));$('file').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>load(t,f.name))};$('demo').onclick=()=>load('[{"name":"A Cruel Angel’s Thesis","bpm":240,"songNotes":[{"time":0,"key":"1Key5"},{"time":250,"key":"1Key7"},{"time":500,"key":"1Key9"},{"time":750,"key":"1Key7"},{"time":1000,"key":"1Key5"}]}]','demo');$('start').onclick=start;$('stop').onclick=stop;$('pause').onclick=()=>{paused=!paused};$('tempo').oninput=e=>$('tempoLabel').textContent=e.target.value+'%';$('listen').onclick=()=>{mode='listen';stop()};$('train').onclick=()=>{mode='train';stop()};$('step').onclick=()=>{mode='step';stop()};$('loadPaste').onclick=()=>load($('paste').value,'pasted');window.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();$('panel').classList.toggle('open')}if(e.key==='Escape')$('panel').classList.remove('open');const i=KEYS.indexOf(e.key.toUpperCase());if(i>=0&&mode==='train'){const hit=events[pos]?.ks.includes(i);document.querySelector(`.note[data-i="${i}"]`)?.classList.add(hit?'hit':'wrong');setTimeout(()=>document.querySelector(`.note[data-i="${i}"]`)?.classList.remove('hit','wrong'),180);if(hit&&!pending.has(i)){pending.add(i);stats.ok++;if(pending.size===events[pos].ks.length){pos++;pending=new Set();}}else stats.bad++;$('stats').textContent=`Верно ${stats.ok} · Ошибки ${stats.bad}`;show()}};$('demo').click();
</script></body></html>
